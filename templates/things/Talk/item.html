{% if item %}
    {% set talk = item %}
{% endif %}
<li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <a href="talk_{{talk.key}}.html">{{talk.name}}</a><br/>
        <a href="{{ talk.author_objects[0].url }}">{{ talk.author_objects[0].name }}</a> at <i>{{ talk.venue }}</i>{% if not hide_date %} ({{ talk.year }}){% endif %}
    </div>
</li>
