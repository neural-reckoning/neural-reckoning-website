{% if item %}
    {% set vid = item %}
{% endif %}
<li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <a href="video_{{vid.key}}.html">{{vid.name}}</a><br/>
        {{ vid.short }}    
    </div>
    <span>{{ vid.type }}{% if not hide_date %}<span style="color: #aaaaaa;"> / {{ vid.last_updated.year }}</span>{% endif %}</span>
</li>
