name: Theoretical and experimental challenges in understanding the brain
authors: Goodman DFM
venue: Sainsbury-Wellcome Centre
abstract: >
  I identify four challenges for understanding the brain: (1) we take on problems that are too easy (2) our concepts don't scale (3) our understanding is unstable (4) doing theory and experiment together.
  This was the introduction to a panel discussion at the 2026 internal SWC symposium.
