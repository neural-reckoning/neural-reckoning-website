short: Physical neuromorphic computing.
long: |-
  <p>
    I’m a PhD student working in the field of physical neuromorphic computing, utilising systems with complex dynamics to gain insights into what features lead to compact and efficient learning. Such systems include heterogeneous lasing photonic networks and nonlinear electronic devices.
  </p>
  <p>
    Iñigo is supervised by <a href="https://profiles.imperial.ac.uk/j.carter-gartside13">Jack Gartside</a> (Physics) and co-supervised by <a href="dan_goodman">Dan Goodman</a> and <a href="https://profiles.imperial.ac.uk/r.sapienza">Riccardo Sapienza</a> (Physics).
  </p>
