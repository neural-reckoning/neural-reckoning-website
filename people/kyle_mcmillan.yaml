short: Local learning and neuromorphic computing.
long: |-
  <p>
    I am particularly interesting in efficient learning for Spiking Neural Networks. Spiking Neural Networks running on neuromorphic devices possess the unique opportunity for fast, low power AI, an important development to prevent the slow cooking of humanity. My research will focus on efficient, biologically inspired training methods for large scale SNNs that can hopefully run on neuromorphic devices, eliminating the need for GPUs in the backward pass.
  </p>
