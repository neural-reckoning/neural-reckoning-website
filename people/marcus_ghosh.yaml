long: >
  <p>
    Marcus Ghosh was a postdoc with us, and now runs his own research group <a href="https://www.neural-forms.org/">Neural forms</a> at Imperial College,
  </p>
  <p>
    In his work he used artificial neural networks to explore how the brain combines information from
    multiple senses (multisensory integration). And how the brain's structure enables its function.
  </p>
